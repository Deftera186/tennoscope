[package]
name = "warframe-status"
version.workspace = true
description = "The warframe.market presence socket: online, in-game, invisible"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
# Blocking, and rustls to match the TLS backend `reqwest` is already pinned to in warframe-market:
# a second TLS stack in one binary is two certificate stores to keep straight.
tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
