[package]
name = "warframe-status"
version.workspace = true
description = "The warframe.market presence socket: online, in-game, invisible"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
# Blocking, and rustls to match the TLS backend `reqwest` is already pinned to in warframe-market:
# a second TLS stack in one binary is two certificate stores to keep straight.
tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
# rustls 0.23 refuses to guess a crypto provider and panics at the first connection if none is
# installed -- which tungstenite's own features do not do. Named explicitly, and `ring` rather than
# aws-lc-rs because that is what the rest of this binary already links through reqwest and keyring:
# two providers in one process is two of everything to audit.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# For `examples/presence_probe.rs`, which reads the credential the way the app does and talks to
# the live socket -- an escape hatch for when a bug only shows in the real server's behaviour.
warframe-market = { path = "../warframe-market" }
