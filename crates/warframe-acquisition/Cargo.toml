[package]
name = "warframe-acquisition"
version.workspace = true
description = "Read-only acquisition of Warframe inventory, rewards and market prices"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Internal workspace crate: the shipped artifact is the TennoScope bundle, not a crates.io release.
publish = false

[dependencies]
aho-corasick = "1"
atomicwrites = "0.4"
memchr = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
url = "2"
warframe-domain = { path = "../warframe-domain" }
zeroize.workspace = true

# procfs and `process_vm_readv` are the Linux backend's whole substance, and neither has a meaning
# on Windows. `nix` does resolve for windows-msvc -- as an empty crate -- so this gate is about
# saying what is true rather than about fixing a build error.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["process", "uio"] }

# The Windows backend reads another process the way procfs does on Linux, through crates that keep
# their own `unsafe` to themselves -- `forbid(unsafe_code)` is per-crate, so it survives here.
#
# `read-process-memory` is pinned exactly: 0.2.0 is days old and its immediate predecessor was
# yanked, so a caret range is an invitation to break on an unattended `cargo update`.
[target.'cfg(windows)'.dependencies]
proc-maps = "0.5"
read-process-memory = "=0.2.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
static_assertions = "1"
tempfile = "3"
