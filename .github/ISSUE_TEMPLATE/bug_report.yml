name: Bug report
description: Something in TennoScope does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check **Diagnostics** in the app — it names which stage failed, which
        is usually most of the answer.

        If Diagnostics shows a **Report block**, use **Copy report** and paste it into the fields
        below — it carries the fault summary and the recent warnings, not the full log. The full
        record (raw log excerpt and rotated logs) lives in the **Save logs** folder — attach
        `report.txt` from there if the issue needs it.

        **Do not attach EE.log to a public issue.** It contains IPs, email addresses and account
        handles — send it to the maintainer on Discord (@deftera) instead. Do not paste account
        identifiers, nonces, or other players' handles either; if you attach a screenshot of a
        reward screen, crop out the names underneath the cards.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Start Warframe through Proton
        2. Crack a relic in a public fissure
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Inventory acquisition (collection is empty, stale, or wrong)
        - Reward overlay (does not appear, wrong place, wrong cards)
        - Pricing (missing, wrong, or never arrives)
        - Catalog / artwork
        - Build or packaging
        - Something else
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: >
        The Diagnostics page, verbatim. It reports subsystem health without any account data.
      render: text

  - type: input
    id: report-folder
    attributes:
      label: Report folder
      description: If you saved a report folder from Diagnostics, attach report.txt here or give the folder's path.

  - type: input
    id: environment
    attributes:
      label: Distribution, compositor and session
      description: >
        Overlay placement is compositor-specific and only sway is exercised, so this matters more
        than usual.
      placeholder: Gentoo, sway 1.11, Wayland
    validations:
      required: true

  - type: input
    id: launcher
    attributes:
      label: How Warframe is launched
      placeholder: Steam + Proton Experimental
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TennoScope version
      description: Or the commit you built from.
    validations:
      required: true

  - type: textarea
    id: tools
    attributes:
      label: External tool versions
      description: Only if the reward overlay is involved. Windows bundles their own tesseract.
      value: |
        $ tesseract --version | head -1
      render: shell
