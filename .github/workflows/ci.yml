name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here needs to finish twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cheap and first: four files declare the release version and nothing else makes them agree.
      - run: ./scripts/check-versions.sh

      # Tauri's Linux system libraries plus tesseract. Screen capture and the crop pipeline are
      # Rust now, so tesseract is the only thing the reward tests still shell out to.
      #
      # The block after libssl is xcap's, not ours. Its Linux capture path links EGL, gbm, wayland
      # and xcb, depends on pipewire unconditionally for the portal route, and generates bindings
      # with bindgen (hence clang). None of it is optional, and a developer machine running a
      # desktop already has every one -- which is why their absence showed up on a runner and not
      # in review. The list is the `-l` flags off the failing link line, not a guess.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libxcb1-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      # No toolchain action: rust-toolchain.toml pins the channel and components, and rustup on
      # the runner installs it on the first cargo call. One source of truth for the version.
      - uses: Swatinem/rust-cache@v2
        with:
          # Names the cache after the platform instead of the job id, so the release workflow --
          # whose jobs are called something else -- can read what this one saves. Caches on the
          # default branch are readable from every ref; caches saved on a tag are not, which is
          # why this side is the one that writes.
          shared-key: linux

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Windows half of the port is invisible to the job above: `cfg(windows)` code is not compiled
  # by a Linux clippy run, so without this leg the Windows backends are never built by anything.
  # It is the only verification vehicle for them -- there is no Windows machine behind this project.
  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The reward tests shell out to tesseract on every platform. Chocolatey appends to the
      # *machine* PATH, which a step already running never sees -- every later step inherits the
      # environment captured when the job started, so the tests reported "tesseract is not
      # available" against an installed tesseract. `$GITHUB_PATH` is the one that reaches them.
      - name: Install tesseract
        run: |
          choco install --no-progress -y tesseract
          "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
        shell: pwsh

      - uses: Swatinem/rust-cache@v2
        with:
          # See the Linux job: the release workflow reads this.
          shared-key: windows

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pnpm version lives in app/package.json, not at the repo root, so the action has to be
      # pointed at it or it finds nothing to install.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # oxlint, then tsc --noEmit, then vitest. Same command a contributor runs locally.
      - run: pnpm check
        working-directory: app
