name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_artifact:
        description: Build an opt-in Windows reward diagnostic installer (artifact only)
        type: boolean
        default: false

# A second push to the same branch cancels the first. Nothing here needs to finish twice.
#
# Except on main, where a release gate is watching. A tag is cut on a main commit, and the release
# workflow refuses to build until this run concludes `success` on that exact SHA -- so cancelling
# it because another commit landed a minute later would fail the release for a reason that has
# nothing to do with the release. Grouping main by SHA means each commit's run is its own group and
# survives; branches and pull requests still collapse to the newest push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cheap and first: four files declare the release version and nothing else makes them agree.
      - run: ./scripts/check-versions.sh

      # Exercises the bundle post-processing against fixtures. In particular, the AppImage must
      # launch its bundled binary rather than an installed /usr/bin/tennoscope that can mask a
      # broken artifact on a maintainer workstation.
      - run: ./scripts/test-build-linux-bundles.sh

      # Guard the local cross-target preflight and the Arch check() contract themselves. Both are
      # cheap shell harnesses: Cargo/pnpm are replaced with recorders, so no second build occurs.
      - run: ./scripts/test-check-windows.sh
      - run: ./scripts/test-arch-pkgbuild.sh

      # Tauri's Linux system libraries plus tesseract. Screen capture and the crop pipeline are
      # Rust now, so tesseract is the only thing the reward tests still shell out to.
      #
      # The block after libssl is xcap's, not ours. Its Linux capture path links EGL, gbm, wayland
      # and xcb, depends on pipewire unconditionally for the portal route, and generates bindings
      # with bindgen (hence clang). None of it is optional, and a developer machine running a
      # desktop already has every one -- which is why their absence showed up on a runner and not
      # in review. The list is the `-l` flags off the failing link line, not a guess.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libxcb1-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      # Ubuntu's compact tessdata_fast model misses a distro-specific production path. Pin Arch's
      # combined legacy+LSTM model so CI exercises the exact package input from issue #9 rather
      # than depending on whichever English data the runner image happens to ship.
      - name: Install Arch English OCR data
        run: |
          curl --fail --location --retry 3 --output /tmp/tesseract-data-eng.pkg.tar.zst \
            https://archive.archlinux.org/packages/t/tesseract-data-eng/tesseract-data-eng-2%3A4.1.0-5-any.pkg.tar.zst
          echo "f6dfc8fd7f70295ce74901b1d1e1a80aaead6430680901ad212074c5bbb68323  /tmp/tesseract-data-eng.pkg.tar.zst" | sha256sum --check
          mkdir -p /tmp/tennoscope-arch-tessdata
          tar --extract --file /tmp/tesseract-data-eng.pkg.tar.zst \
            --directory /tmp/tennoscope-arch-tessdata \
            usr/share/tessdata/eng.traineddata

      # No toolchain action: rust-toolchain.toml pins the channel and components, and rustup on
      # the runner installs it on the first cargo call. One source of truth for the version.
      - uses: Swatinem/rust-cache@v2
        with:
          # Names the cache after the platform instead of the job id, so the release workflow --
          # whose jobs are called something else -- can read what this one saves. Caches on the
          # default branch are readable from every ref; caches saved on a tag are not, which is
          # why this side is the one that writes.
          shared-key: linux

      - name: Test Arch OCR quantity model
        env:
          TESSDATA_PREFIX: /tmp/tennoscope-arch-tessdata/usr/share/tessdata
        run: >-
          cargo test -p tennoscope --lib
          kiosk_ocr::tests::reads_stacked_quantity_through_production_basket_geometry
          --locked -- --exact

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The full suite intentionally uses Ubuntu's installed English data; the targeted Arch model
      # check above owns the distro-specific assertion without changing every OCR test's baseline.
      - run: cargo test --workspace

  # The Windows half of the port is invisible to the job above: `cfg(windows)` code is not compiled
  # by a Linux clippy run, so without this leg the Windows backends are never built by anything.
  # It is the only verification vehicle for them -- there is no Windows machine behind this project.
  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test transient download recovery
        run: ./scripts/test-download-with-retry.ps1
        shell: pwsh

      # The reward tests shell out to tesseract on every platform. Windows gets the same portable
      # UB-Mannheim build the installer bundles -- scripts/vendor-windows-tesseract.ps1 -- rather
      # than a Chocolatey package, which makes CI read through the engine players actually run.
      # It also sidesteps community.chocolatey.org: on 2026-08-21 it answered choco's resolver
      # with 504s, choco reported "installed 0/0 packages", exited 0 anyway, and the job spent
      # ten minutes building before eight reward tests failed with "tesseract is not available".
      #
      # A step already running never sees a PATH edit -- every later step inherits the environment
      # captured when the job started -- so $GITHUB_PATH is the one that reaches the tests. They
      # resolve bare `tesseract` off it with no resource directory, so the OCR path cannot hand
      # the engine --tessdata-dir; TESSDATA_PREFIX is what sends it to the training data sitting
      # beside the executable.
      - name: Vendor tesseract
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh

      - name: Put tesseract on PATH
        run: |
          $vendor = Resolve-Path "app/src-tauri/vendor/tesseract"
          "$vendor" >> $env:GITHUB_PATH
          "TESSDATA_PREFIX=$vendor" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: Swatinem/rust-cache@v2
        with:
          # See the Linux job: the release workflow reads this.
          shared-key: windows

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pnpm version lives in app/package.json, not at the repo root, so the action has to be
      # pointed at it or it finds nothing to install.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # oxlint, then tsc --noEmit, then vitest. Same command a contributor runs locally.
      - run: pnpm check
        working-directory: app

  diagnostic-windows:
    name: Windows diagnostic artifact
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_artifact }}
    needs: [rust, windows, frontend]
    runs-on: windows-latest
    env:
      TENNOSCOPE_DIAGNOSTIC_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # Use the same portable engine and data as the release installer and Windows CI.
      - name: Vendor tesseract for the bundle
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh

      - name: Put tesseract on PATH for diagnostic-feature tests
        run: |
          $vendor = Resolve-Path "app/src-tauri/vendor/tesseract"
          "$vendor" >> $env:GITHUB_PATH
          "TESSDATA_PREFIX=$vendor" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false

      - name: Check diagnostic-feature Rust on Windows
        run: cargo clippy --workspace --all-targets --features tennoscope/reward-diagnostics --locked -- -D warnings

      - name: Test diagnostic-feature Rust on Windows
        run: cargo test --workspace --features tennoscope/reward-diagnostics --locked

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build optimized diagnostic installer
        run: pnpm tauri build --bundles nsis --features reward-diagnostics
        working-directory: app
        env:
          # Bounded, opt-in recording is separate from the unbounded debug crop retention.
          # Keep this step-scoped so the release cache key still matches Windows CI.
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "false"

      - name: Install and smoke-test bundled OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $installed = Join-Path $env:RUNNER_TEMP 'tennoscope-issue12-installed'
          # NSIS requires /D to be last and unquoted, even when the path contains spaces.
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$installed" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }

          $app = Join-Path $installed 'tennoscope.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw 'Installed app executable is missing' }
          # Tauri patches the first bundle marker for NSIS, then restores the build executable.
          # Reproduce that exact transformation; every other installed byte must still match.
          $expected = [System.IO.File]::ReadAllBytes((Resolve-Path 'target/release/tennoscope.exe').Path)
          $marker = '__TAURI_BUNDLE_TYPE_VAR_UNK'
          $offset = [System.Text.Encoding]::ASCII.GetString($expected).IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($offset -lt 0) { throw 'Tauri bundle marker is absent from the build executable' }
          [System.Text.Encoding]::ASCII.GetBytes('__TAURI_BUNDLE_TYPE_VAR_NSS').CopyTo($expected, $offset)
          $expectedHash = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($expected))
          if ((Get-FileHash -LiteralPath $app).Hash -ne $expectedHash) {
            throw 'Installed app does not match the diagnostic build'
          }
          $vendor = Resolve-Path 'app/src-tauri/vendor/tesseract'
          $ocr = Join-Path $installed 'tesseract'
          # Check every executable, DLL and data file survived the actual installer unchanged.
          foreach ($source in Get-ChildItem -LiteralPath $vendor -File) {
            $destination = Join-Path $ocr $source.Name
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) { throw "Missing bundled file: $($source.Name)" }
            if ((Get-FileHash -LiteralPath $source.FullName).Hash -ne (Get-FileHash -LiteralPath $destination).Hash) {
              throw "Bundled file differs: $($source.Name)"
            }
          }

          # No PATH or language-data fallback to the vendored development copy or runner tools.
          Remove-Item -LiteralPath Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:OMP_THREAD_LIMIT = '1'
          $fixture = (Resolve-Path 'app/src-tauri/tests/fixtures/reward-crop-ornament.png').Path
          $stderr = Join-Path $env:RUNNER_TEMP 'tennoscope-bundled-ocr-stderr.txt'
          $text = & (Join-Path $ocr 'tesseract.exe') --tessdata-dir $ocr $fixture - --psm 11 2> $stderr
          $exitCode = $LASTEXITCODE
          $errors = Get-Content -LiteralPath $stderr -Raw
          Write-Host "Bundled OCR stdout: $($text -join ' ')"
          Write-Host "Bundled OCR stderr: $errors"
          if ($exitCode -ne 0) { throw "Bundled OCR failed: $exitCode" }
          $normalised = (($text -join ' ') -replace '[^A-Za-z0-9]+', ' ').Trim()
          if ($normalised -notmatch '\bDual Zoren Prime Handle\b') {
            throw "Bundled OCR did not read Dual Zoren Prime Handle: $normalised"
          }
          Write-Host 'Installer and bundled OCR runtime smoke passed; this is not Windows 10 gameplay validation.'

      - name: Prepare diagnostic artifact and instructions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'app/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $output = New-Item -ItemType Directory -Path 'diagnostic-artifact'
          $installer = Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*-setup.exe' -File
          $name = "TennoScope-$version-issue12-diagnostic-$env:GITHUB_SHA-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $output $name)
          @"
          TennoScope issue #12 - opt-in Windows reward diagnostic build
          App version: $version (unchanged); diagnostic build SHA: $env:GITHUB_SHA
          CI run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          This is an Actions artifact, not a release or a recognition fix. CI checks the
          installer and bundled OCR at runtime; it does not validate Windows 10 gameplay.
          The installer is unsigned and may trigger a Windows SmartScreen warning.
          It uses the normal TennoScope app identity, so close TennoScope before installing.

          1. Install $name. Open Diagnostics and confirm the diagnostic SHA shown above.
          2. Allow screen capture and explicitly click Record reward diagnostic in
             Diagnostics. Recording is off until you choose to start it.
          3. Run a short squad fissure within 10 minutes. Keep Warframe focused through
             the reward choices; do not switch windows while the reward cards are visible.
          4. After the choices, click Save logs. This stops recording and saves the evidence.
             ZIP the complete saved report folder, including reward-diagnostics, not just
             the text logs. Screenshots are not included in copied clipboard text.
          5. Review every image and the rest of the report before sharing. Images may show
             player names, chat, or overlapping windows. Remove anything you do not want
             to share, then attach the ZIP to issue #12 yourself. Nothing auto-uploads.

          Recording is bounded: at most one sample every 3 seconds, the newest 12 samples,
          64 MiB total, and a 10-minute session limit. Starting again replaces the previous
          session, so save the report first. Reward close, game exit, or access downgrade
          also stops recording without discarding captured evidence.

          SHA256SUMS contains SHA-256 checksums of this file and the installer.
          This Actions artifact expires after 14 days.
          "@ | Set-Content -LiteralPath (Join-Path $output 'INSTRUCTIONS.txt') -Encoding utf8
          Get-ChildItem -LiteralPath $output -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS') -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: tennoscope-issue12-diagnostic-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-artifact/
          if-no-files-found: error
          retention-days: 14
