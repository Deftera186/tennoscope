name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here needs to finish twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tauri's Linux system libraries, plus tesseract and ImageMagick's `import`. The reward tests
      # skip nothing, so everything they shell out to has to be here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            imagemagick \
            tesseract-ocr \
            tesseract-ocr-eng

      # noble's `imagemagick` is 6.9, which has no `magick` binary -- that name only exists in 7,
      # and the OCR crop pipeline is written against it. The AppImage is upstream's only prebuilt
      # 7 for Linux; it is extracted rather than run directly because the runner has no FUSE.
      - name: Install ImageMagick 7
        run: |
          curl -fsSL -o magick.AppImage \
            https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-29/ImageMagick-7.1.2-29-gcc-x86_64.AppImage
          chmod +x magick.AppImage
          ./magick.AppImage --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/imagemagick
          sudo ln -s /opt/imagemagick/AppRun /usr/local/bin/magick
          rm magick.AppImage
          magick -version

      # No toolchain action: rust-toolchain.toml pins the channel and components, and rustup on
      # the runner installs it on the first cargo call. One source of truth for the version.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pnpm version lives in app/package.json, not at the repo root, so the action has to be
      # pointed at it or it finds nothing to install.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # oxlint, then tsc --noEmit, then vitest. Same command a contributor runs locally.
      - run: pnpm check
        working-directory: app
