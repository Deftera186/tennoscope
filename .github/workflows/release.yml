name: Release

# Releases are cut by hand: tag a commit `v0.1.0` and push the tag. Nothing here fires on a
# branch push, so merging to main never publishes anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundles:
    name: Linux bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            imagemagick \
            tesseract-ocr \
            tesseract-ocr-eng

      # Same as CI: noble's `imagemagick` is 6.9 and has no `magick` binary, which the OCR crop
      # pipeline is written against. Needed here because the bundle script runs the test suite.
      - name: Install ImageMagick 7
        run: |
          curl -fsSL -o magick.AppImage \
            https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-29/ImageMagick-7.1.2-29-gcc-x86_64.AppImage
          chmod +x magick.AppImage
          ./magick.AppImage --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/imagemagick
          sudo ln -s /opt/imagemagick/AppRun /usr/local/bin/magick
          rm magick.AppImage
          magick -version

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # Not a bare `pnpm tauri build`. The helper runs the test suite, clippy and `pnpm check`
      # first, and then asserts that the AppImage it just produced still forces `GDK_BACKEND=x11`
      # -- the property the reward overlay depends on, and the only check of it that runs against
      # the artifact users actually download.
      - run: ./scripts/build-linux-bundles.sh appimage deb rpm

      # A draft, not a publish. The release notes are written by hand from CHANGELOG.md and the
      # release goes out when the maintainer says so.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
